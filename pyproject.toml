# Конфигурация инструментов разработки.
#
# Таблицы [project] здесь намеренно нет: Shin — приложение, а не
# устанавливаемый дистрибутив. Файл существует только ради того, чтобы
# правила стиля были записаны в репозитории, а не жили в голове.
#
# Запуск:
#   python -m ruff check .
#   python -m ruff check . --fix

[tool.ruff]
# 120 символов проходило бы без единой правки, но фактический стиль кода —
# около ста. Граница в 110 оставляет запас на длинные сигнатуры и при этом
# остаётся требованием, а не формальностью.
line-length = 110
target-version = "py311"
extend-exclude = ["frontend", "backend/data", "backend/models"]

[tool.ruff.lint]
select = [
    "E",        # pycodestyle: ошибки оформления
    "W",        # pycodestyle: предупреждения
    "F",        # pyflakes: неиспользуемые импорты и имена, опечатки
    "I",        # isort: порядок импортов
    "UP",       # pyupgrade: устаревшие конструкции
    "B",        # bugbear: живые ловушки вроде изменяемых значений по умолчанию
    "C4",       # лишние генераторы там, где хватает comprehension
    "SIM",      # упрощения условий и контекстных менеджеров
    "BLE",      # `except Exception` без причины
    "RUF",      # собственные правила ruff
    "PLR0124",  # сравнение имени с самим собой
]

ignore = [
    # Кириллица в тексте — не «подозрительно похожий на латиницу символ»,
    # а язык, на котором написана документация проекта. Эти три правила
    # ловят подмену букв в идентификаторах; здесь же они срабатывают
    # на каждой русской строке, комментарии и docstring — 668 раз,
    # то есть на девять десятых всего вывода линтера. Такой шум не просто
    # бесполезен: он прячет настоящие находки.
    "RUF001",  # ambiguous character in string
    "RUF002",  # ambiguous character in docstring
    "RUF003",  # ambiguous character in comment
]

# `# noqa: E402` расставлены в скриптах точечно — ровно на тех импортах,
# что обязаны идти после правки `sys.path`. Через per-file-ignores это
# работало бы грубее: E402 отключилось бы во всём файле, включая импорты,
# которые ничего не требуют. Поэтому здесь исключений нет намеренно.

[tool.ruff.lint.isort]
# Без этого `app` попадает в блок сторонних пакетов и смешивается
# с pandas и pytest. Это пакет проекта, и группа у него своя.
known-first-party = ["app"]
