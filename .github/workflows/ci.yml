# Непрерывная проверка.
#
# До этого файла 207 тестов, линтеры и сборка запускались только руками —
# сломанный коммит мог попасть в dev незамеченным. А Docker-сборка не
# выполнялась вообще ни разу: на машине разработки Docker отсутствует
# (решение D-6 в ТЗ). Здесь она наконец выполняется, и на каждый push.

name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  backend:
    name: Backend — линтер и тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Та же версия, что в docker/backend.Dockerfile: проверять стоит
          # то, что поедет в образ, а не то, что стоит у разработчика.
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-optional.txt

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-optional.txt

      - name: Линтер
        run: python -m ruff check .

      - name: Датасет, модель и аналитика
        # Артефакты не лежат в репозитории (.gitignore исключает CSV
        # и .joblib), а тесты HTTP-слоя поднимают приложение с настоящей
        # моделью. Генерация и обучение детерминированы: метрики выходят
        # ровно те, что записаны в README.
        #
        # Аналитика выгружается здесь же, и это обязательно. Обучение ставит
        # модели новую метку времени, а `evaluation.json` в репозитории
        # посчитан на модели с машины разработчика. Без перевыгрузки отчёт
        # относится к чужой модели — что и ловит проверка свежести
        # в test_analytics.py. Ровно так же поступает docker/backend.Dockerfile.
        run: |
          python backend/scripts/generate_dataset.py
          python backend/scripts/train_model.py
          python backend/scripts/export_evaluation.py

      - name: Тесты
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: Frontend — линтер, тесты, сборка
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Та же версия, что в docker/frontend.Dockerfile.
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Зависимости
        run: npm ci

      - name: Линтер
        run: npm run lint

      - name: Тесты
        run: npm test

      - name: Сборка
        run: npm run build

  docker:
    name: Docker — сборка и живой стек
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Сборка разбита на шаги по стадиям Dockerfile намеренно. Одна команда
      # `docker compose up --build` на падении сообщает только «exit code 1»,
      # и понять, что именно сломалось — установка зависимостей, обучение
      # модели или сборка фронтенда, — можно лишь по логам. Имя упавшего шага
      # видно сразу, в том числе снаружи.

      - name: Backend — системные пакеты и зависимости
        run: docker build --target base -f docker/backend.Dockerfile -t shin-base:ci .

      - name: Backend — датасет и обучение модели
        # Самый долгий шаг: внутри образа генерируется 100 000 транзакций
        # и обучается модель.
        run: docker build --target build -f docker/backend.Dockerfile -t shin-build:ci .

      - name: Backend — итоговый образ
        run: docker build -f docker/backend.Dockerfile -t shin-backend:latest .

      - name: Frontend — сборка бандла и образа
        run: docker build -f docker/frontend.Dockerfile -t shin-frontend:latest .

      - name: Поднять стек
        # Образы уже собраны выше и названы так же, как в docker-compose.yml,
        # поэтому здесь ничего не пересобирается. --wait держит шаг, пока
        # healthcheck не подтвердит, что модель загружена.
        run: docker compose up --detach --wait --wait-timeout 300

      # --- диагностика ---
      #
      # Логи GitHub Actions отдаёт только администратору репозитория, а имена
      # шагов и их статусы видны всем. Поэтому каждая проверка вынесена
      # в отдельный шаг с говорящим именем: по тому, какой из них покраснел,
      # причина ясна и без доступа к логам.
      #
      # Все шаги идут ПОСЛЕ подъёма и выполняются всегда: проверка, поставленная
      # перед `up`, при падении просто отменяет его, и вместо полной картины
      # остаётся один факт.

      - name: Диагностика — синтаксис конфига nginx
        if: always()
        # --add-host обязателен: nginx резолвит имена upstream при загрузке
        # конфига, а сети compose в одиночном `docker run` нет. Без подмены
        # шаг падал бы на отсутствии хоста `backend`, так и не дойдя
        # до проверки синтаксиса, ради которой он здесь и стоит.
        run: docker run --rm --add-host backend:127.0.0.1 shin-frontend:latest nginx -t

      - name: Диагностика — контейнер backend работает
        if: always()
        run: test "$(docker inspect -f '{{.State.Status}}' shin-backend)" = running

      - name: Диагностика — контейнер frontend работает
        if: always()
        run: test "$(docker inspect -f '{{.State.Status}}' shin-frontend)" = running

      - name: Диагностика — backend здоров
        if: always()
        run: test "$(docker inspect -f '{{.State.Health.Status}}' shin-backend)" = healthy

      - name: Диагностика — frontend здоров
        if: always()
        run: test "$(docker inspect -f '{{.State.Health.Status}}' shin-frontend)" = healthy

      - name: Диагностика — backend отвечает на /health
        if: always()
        run: curl -fsS --max-time 10 http://localhost:8000/health

      - name: Диагностика — страница отдаётся с порта 3000
        if: always()
        run: curl -fsS --max-time 10 -o /dev/null http://localhost:3000/

      # Проба закрепляет вывод расследования: healthcheck фронтенда должен
      # ходить по IPv4. Обращение к localhost здесь было бы красным всегда —
      # `listen 80` поднимает только IPv4, а busybox wget с ::1 на следующий
      # адрес не переходит. Подробности — в docker/frontend.Dockerfile.
      - name: Диагностика — wget внутри контейнера по IPv4
        if: always()
        run: docker exec shin-frontend wget -q --spider http://127.0.0.1/

      - name: Backend жив и модель загружена
        run: curl -fsS http://localhost:8000/health | grep -q '"model_loaded":true'

      - name: Интерфейс отдаётся nginx
        run: curl -fsS -o /dev/null http://localhost:3000/

      - name: Запрос проходит через nginx на backend
        # Тот самый путь, ради которого в nginx.conf у proxy_pass стоит
        # завершающий слеш: /api/predict превращается в /predict.
        run: |
          curl -fsS -X POST http://localhost:3000/api/predict \
            -H 'Content-Type: application/json' \
            -d '{"user_id":"ci","amount":100,"merchant":"Magnum","country":"KZ","device_id":"dev_ci","ip_address":"85.132.10.55","latitude":51.16,"longitude":71.44,"transaction_frequency":3,"previous_transaction_amount":95,"previous_transaction_country":"KZ","account_age_days":800,"persist":false}' \
            | grep -q '"decision"'

      - name: Полная цепочка на готовом сценарии
        run: |
          curl -fsS -X POST 'http://localhost:3000/api/scenarios/multiple_anomalies/run?persist=false' \
            | grep -q '"explanation"'

      - name: Логи при неудаче
        if: failure()
        run: docker compose logs --no-color

      - name: Остановить
        if: always()
        run: docker compose down --volumes
