# Раздача собранного интерфейса и проксирование API.
#
# Ключевая роль здесь — прокси. Браузер работает на машине пользователя и
# внутреннюю сеть Docker не видит, поэтому обращаться напрямую к
# `http://backend:8000` он не может. Интерфейс шлёт запросы на `/api/...`
# того же origin, а nginx переправляет их в контейнер backend.
#
# Побочная выгода: запросы становятся одноисточниковыми, и CORS в этой
# схеме не участвует вовсе.

upstream shin_backend {
    # Имя сервиса из docker-compose.yml.
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- API ---
    # Завершающий слэш в proxy_pass обязателен: он отрезает префикс `/api`,
    # поэтому `/api/predict` уходит на backend как `/predict`. Без слэша
    # backend получил бы `/api/predict` и ответил 404.
    location /api/ {
        proxy_pass http://shin_backend/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Первый запрос после старта ждёт загрузки модели и SHAP-объяснителя.
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # --- Swagger и схема ---
    # Проксируются отдельно, чтобы документация API открывалась с того же
    # адреса, что и интерфейс.
    location /docs {
        proxy_pass http://shin_backend/docs;
        proxy_set_header Host $host;
    }

    location /redoc {
        proxy_pass http://shin_backend/redoc;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://shin_backend/openapi.json;
        proxy_set_header Host $host;
    }

    # --- статика ---
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Интерфейс — одна страница; любой неизвестный путь отдаёт её.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
