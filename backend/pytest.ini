[pytest]
# rootdir = backend/, поэтому пакет `app` доступен для импорта без установки
pythonpath = .
testpaths = tests
python_files = test_*.py
addopts = -v --tb=short

# Предупреждение SHAP о формате вывода гасится на старте приложения
# (app/xai/contributions.py). Pytest оборачивает каждый тест в собственный
# `catch_warnings` и откатывает фильтры процесса, поэтому в тестах его
# приходится гасить средствами самого pytest.
filterwarnings =
    ignore:.*output has changed.*:UserWarning
